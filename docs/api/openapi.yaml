openapi: 3.0.3
info:
  title: Los Malditos API
  version: 1.0.0
  description: |
    API REST para el lavadero de motos Los Malditos.
    La moneda es COP y la zona horaria de negocio es America/Bogota.
    No incluye pasarela de pagos: los pagos son registrados manualmente por el administrador.
servers:
  - url: https://apilosmalditos.jminternet.online/api/v1
    description: Producción
  - url: http://localhost:8080/api/v1
    description: Desarrollo
tags:
  - name: Auth
  - name: Clientes
  - name: Motos
  - name: Servicios
  - name: Citas
  - name: Lavadas
  - name: Notificaciones
  - name: Fidelización
  - name: Finanzas
  - name: Inventario
  - name: Empleados
  - name: Promociones
  - name: Reseñas
  - name: Foro
  - name: Reportes
  - name: Configuración
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Iniciar sesión con usuario y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renovar access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revocar sesión actual
      responses:
        '200': { $ref: '#/components/responses/Empty' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Cambiar contraseña propia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customers:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: Solo Administrador. Incluye búsqueda, estado y segmentación.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [active, blocked] } }
      responses:
        '200': { $ref: '#/components/responses/CustomerPage' }
    post:
      tags: [Clientes]
      summary: Crear cliente desde mostrador
      description: Únicamente Administrador. No existe registro público de clientes y no recibe teléfono, correo, placa ni cédula.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/SuccessUser' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clientes]
      summary: Ver cliente e historial
      responses:
        '200': { $ref: '#/components/responses/Customer' }
    patch:
      tags: [Clientes]
      summary: Editar nombre, notas o estado del cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                notes: { type: string, nullable: true }
                isBlocked: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Customer' }
  /customers/{id}/reset-password:
    post:
      tags: [Clientes]
      summary: Restablecer contraseña de cliente
      description: Solo Administrador. Devuelve una temporal; obliga a cambiarla al iniciar.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Contraseña temporal generada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          temporaryPassword: { type: string }
                          mustChangePassword: { type: boolean }
  /customers/{customerId}/motorcycles:
    get:
      tags: [Clientes, Motos]
      summary: Listar motos actualmente asociadas a un cliente
      description: Administrador puede consultar cualquier cliente; Cliente únicamente su propio customerId.
      parameters:
        - { in: path, name: customerId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/MotorcyclePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /motorcycles:
    get:
      tags: [Motos]
      summary: Listar motos visibles para el usuario
      description: Administrador ve todas las motos (asignadas y sin asignar) con filtros. Cliente solo ve sus motos actualmente asociadas.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [assigned, unassigned] } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/MotorcyclePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Motos]
      summary: Registrar moto (solo Administrador)
      description: Únicamente Administrador puede registrar motos, con o sin customerId inicial.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotorcycleInput' }
      responses:
        '201': { $ref: '#/components/responses/Motorcycle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /motorcycles/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Motos]
      summary: Editar moto (solo Administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotorcyclePatchInput' }
      responses:
        '200': { $ref: '#/components/responses/Motorcycle' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Motos]
      summary: Eliminar moto definitivamente (solo Administrador)
      description: Solo permite eliminar si customerId es null y no tiene citas, lavadas, pagos, reseñas, fidelización ni historial de asociaciones.
      responses:
        '204': { description: Eliminada definitivamente }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /motorcycles/{id}/assignment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Motos]
      summary: Asociar o reasignar una moto a un cliente (solo Administrador)
      description: Asocia una moto libre o reasigna una ya asociada dejando trazabilidad en motorcycle_customer_assignments. Idempotente si ya está asociada al mismo cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentInput' }
      responses:
        '200': { $ref: '#/components/responses/MotorcycleAssignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Motos]
      summary: Desvincular moto de su cliente sin eliminarla (solo Administrador)
      description: Cambia customerId a null y conserva la moto junto con todas sus citas, lavadas, pagos, reseñas, fidelización e historial. Idempotente si ya estaba desvinculada.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/MotorcycleUnlink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /motorcycles/{id}/assignments:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
    get:
      tags: [Motos]
      summary: Consultar historial de asociaciones de una moto (solo Administrador)
      responses:
        '200': { $ref: '#/components/responses/MotorcycleAssignmentPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services:
    get:
      tags: [Servicios]
      security: []
      summary: Catálogo de servicios activos
      responses:
        '200': { $ref: '#/components/responses/ServicePage' }
    post:
      tags: [Servicios]
      summary: Crear servicio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '201': { $ref: '#/components/responses/Service' }
  /services/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Servicios]
      summary: Editar o activar/desactivar servicio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '200': { $ref: '#/components/responses/Service' }
    delete:
      tags: [Servicios]
      summary: Eliminar servicio
      responses:
        '204': { description: Eliminado }
  /appointments/availability:
    get:
      tags: [Citas]
      security: []
      summary: Consultar horarios disponibles
      parameters:
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
        - { in: query, name: serviceId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: motorcycleId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Horarios y capacidad disponible
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          date: { type: string, format: date }
                          slots:
                            type: array
                            items: { $ref: '#/components/schemas/AvailabilitySlot' }
  /appointments:
    get:
      tags: [Citas]
      summary: Listar citas
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/AppointmentPage' }
    post:
      tags: [Citas]
      summary: Crear cita
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentInput' }
      responses:
        '201': { $ref: '#/components/responses/Appointment' }
        '409': { $ref: '#/components/responses/Conflict' }
  /appointments/{id}/cancel:
    post:
      tags: [Citas]
      summary: Cancelar cita con motivo
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, nullable: true } }
      responses:
        '200': { $ref: '#/components/responses/Appointment' }
  /appointments/{id}/reschedule:
    post:
      tags: [Citas]
      summary: Reprogramar cita
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt]
              properties:
                startAt: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Appointment' }
  /wash-requests:
    get:
      tags: [Lavadas]
      summary: Listar lavadas y cola del día
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending_confirmation, confirmed, rejected, expired, washing, drying, ready, paid, cancelled] } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/WashRequestPage' }
    post:
      tags: [Lavadas]
      summary: Crear y enviar lavada para confirmación
      description: Solo Administrador o Lavador autorizado. Debe ser idempotente con X-Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WashRequestInput' }
      responses:
        '201': { $ref: '#/components/responses/WashRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /wash-requests/{id}/confirm:
    post:
      tags: [Lavadas]
      summary: Confirmar lavada
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/WashRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /wash-requests/{id}/reject:
    post:
      tags: [Lavadas]
      summary: Rechazar lavada
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, nullable: true, maxLength: 500 } }
      responses:
        '200': { $ref: '#/components/responses/WashRequest' }
  /wash-requests/{id}/resend:
    post:
      tags: [Lavadas]
      summary: Reenviar lavada vencida o rechazada
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/WashRequest' }
  /wash-requests/{id}/status:
    patch:
      tags: [Lavadas]
      summary: Cambiar estado operativo
      description: Lavador o Administrador. Transiciones válidas washing, drying, ready, paid.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [washing, drying, ready, paid, cancelled] }
                employeeId: { type: string, format: uuid, nullable: true }
                beforePhotoUrl: { type: string, format: uri, nullable: true }
                afterPhotoUrl: { type: string, format: uri, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/WashRequest' }
  /notifications:
    get:
      tags: [Notificaciones]
      summary: Notificaciones del usuario autenticado
      parameters:
        - { in: query, name: unread, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { $ref: '#/components/responses/NotificationPage' }
  /notifications/{id}/read:
    patch:
      tags: [Notificaciones]
      summary: Marcar notificación como leída
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Notification' }
  /notifications/read-all:
    post:
      tags: [Notificaciones]
      summary: Marcar todas como leídas
      responses:
        '200': { $ref: '#/components/responses/Empty' }
  /devices:
    post:
      tags: [Notificaciones]
      summary: Registrar token FCM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [android, ios, web] }
      responses:
        '201': { $ref: '#/components/responses/Empty' }
  /loyalty/me:
    get:
      tags: [Fidelización]
      summary: Tarjeta 7+1 del cliente autenticado
      description: Roles permitidos Cliente, Lavador y Administrador. Devuelve sellos, lavadas completadas, token QR con expiración y recompensas.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tarjeta de fidelización consultada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltyCard' } }
              example:
                data:
                  id: 33333333-3333-4333-8333-333333333333
                  customerId: 11111111-1111-4111-8111-111111111111
                  stamps: 4
                  completedWashes: 11
                  qrToken: LM-token-seguro
                  qrTokenExpiresAt: '2026-11-20T12:00:00.000-05:00'
                  updatedAt: '2026-11-19T12:00:00.000-05:00'
                  rewards:
                    - id: 22222222-2222-4222-8222-222222222222
                      customerId: 11111111-1111-4111-8111-111111111111
                      title: Lavada gratis
                      validFrom: '2026-11-01T00:00:00.000-05:00'
                      validUntil: '2026-12-01T23:59:59.000-05:00'
                      status: available
                      source: automatic
                message: Información de fidelización consultada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
  /loyalty/stamps:
    post:
      tags: [Fidelización]
      summary: Registrar sello por lavada pagada
      description: Solo Administrador o Lavador autorizado. Valida estado paid, evita duplicados por washRequestId, respeta X-Idempotency-Key / Idempotency-Key, al llegar a 7 crea recompensa automática y reinicia sellos a 0.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [washRequestId]
              properties: { washRequestId: { type: string, format: uuid } }
            example:
              washRequestId: 6f29a8d2-90c8-4c5c-96f9-4b1de594d901
      responses:
        '201': { $ref: '#/components/responses/Loyalty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/rewards:
    get:
      tags: [Fidelización]
      summary: Premios disponibles y asignados
      description: Cliente solo consulta sus propias recompensas. Administrador y Lavador autorizado pueden consultar y filtrar por customerId y status.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: customerId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [available, redeemed, expired, cancelled] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/LoyaltyPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/rewards/{id}:
    delete:
      tags: [Fidelización]
      summary: Cancelar recompensa disponible
      description: Solo Administrador. Cambia el estado a cancelled sin borrar historial. Rechaza recompensas redeemed, expired o cancelled con 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyReasonInput' }
            example:
              reason: Recompensa anulada por ajuste administrativo
      responses:
        '200':
          description: Recompensa cancelada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltyReward' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/rewards/{id}/redeem:
    post:
      tags: [Fidelización]
      summary: Redimir premio dentro del periodo asignado
      description: Solo el cliente propietario o Administrador autorizado. Requiere X-Idempotency-Key / Idempotency-Key, valida vigencia (validFrom - validUntil) y pertenencia de appointmentId.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                appointmentId: { type: string, format: uuid, nullable: true }
            example:
              appointmentId: 55555555-5555-4555-8555-555555555555
      responses:
        '200': { $ref: '#/components/responses/Loyalty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/customers:
    get:
      tags: [Fidelización]
      summary: Consultar fidelización de todos los clientes
      description: Solo Administrador. Soporta búsqueda, filtro de estado y ordenamiento paginado.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [all, available_reward, no_reward, blocked], default: all } }
        - { in: query, name: sort, schema: { type: string, enum: [stamps_desc, completed_washes_desc, newest], default: newest } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/LoyaltyCustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/customers/{customerId}:
    get:
      tags: [Fidelización]
      summary: Consultar detalle e historial de fidelización de un cliente
      description: Solo Administrador. Devuelve sellos actuales, historial de sellos, lavadas asociadas, recompensas por estado y auditoría de Fidelización.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle e historial de fidelización del cliente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltyCustomerDetail' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/customers/{customerId}/stamps:
    post:
      tags: [Fidelización]
      summary: Registrar sello administrativo o autorizado sobre una lavada del cliente
      description: Solo Administrador o Lavador autorizado. Exige Idempotency-Key / X-Idempotency-Key, valida pertenencia de washRequestId al customerId y estado paid.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyCustomerStampInput' }
            example:
              washRequestId: 6f29a8d2-90c8-4c5c-96f9-4b1de594d901
              reason: Lavada pagada registrada en mostrador
      responses:
        '201': { $ref: '#/components/responses/Loyalty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/customers/{customerId}/stamps/{stampId}:
    delete:
      tags: [Fidelización]
      summary: Retirar o revertir un sello de fidelización
      description: Solo Administrador. Marca el sello como reversed sin borrar historial; si generó recompensa available la cancela y bloquea con 409 si ya fue redeemed.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: stampId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyReasonInput' }
            example:
              reason: Sello registrado por error
      responses:
        '200':
          description: Sello revertido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stamp: { $ref: '#/components/schemas/LoyaltyStamp' }
                          card: { $ref: '#/components/schemas/LoyaltyCard' }
                          revertedReward:
                            allOf: [{ $ref: '#/components/schemas/LoyaltyReward' }]
                            nullable: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/customers/{customerId}/rewards:
    post:
      tags: [Fidelización]
      summary: Asignar recompensa manual a un cliente
      description: Solo Administrador. Crea recompensa en estado available interpretando fechas en America/Bogota y validando rango y vigencia máxima.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: customerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyManualRewardInput' }
            example:
              title: Lavada gratis
              validFrom: '2026-11-20T00:00:00-05:00'
              validUntil: '2026-11-25T23:59:59-05:00'
              reason: Premio especial autorizado por administración
      responses:
        '201':
          description: Recompensa manual asignada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltyReward' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /loyalty/expire:
    post:
      tags: [Fidelización]
      summary: Expirar recompensas cuya vigencia ha terminado
      description: Solo Administrador. Operación idempotente que cambia recompensas available vencidas a expired, audita y notifica a los clientes afectados. Devuelve 409 LOYALTY_DISABLED si la campaña está desactivada.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proceso de expiración ejecutado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltyExpireResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments:
    post:
      tags: [Finanzas]
      summary: Registrar pago manual
      description: Solo Administrador o Lavador. No procesa tarjetas ni pasarelas.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { $ref: '#/components/responses/Payment' }
  /expenses:
    get:
      tags: [Finanzas]
      summary: Listar gastos
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { $ref: '#/components/responses/ExpensePage' }
    post:
      tags: [Finanzas]
      summary: Registrar gasto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201': { $ref: '#/components/responses/Expense' }
  /incomes:
    get:
      tags: [Finanzas]
      summary: Listar ingresos, incluidos cargos de cancelación
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { $ref: '#/components/responses/IncomePage' }
  /inventory/items:
    get:
      tags: [Inventario]
      summary: Listar inventario y alertas de stock
      responses:
        '200': { $ref: '#/components/responses/InventoryPage' }
    post:
      tags: [Inventario]
      summary: Crear insumo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
      responses:
        '201': { $ref: '#/components/responses/Inventory' }
  /inventory/items/{id}/movements:
    post:
      tags: [Inventario]
      summary: Entrada o salida de inventario
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, quantity]
              properties:
                type: { type: string, enum: [in, out, adjustment] }
                quantity: { type: number, minimum: 0 }
                reason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Inventory' }
  /employees:
    get:
      tags: [Empleados]
      summary: Listar empleados
      responses:
        '200': { $ref: '#/components/responses/EmployeePage' }
    post:
      tags: [Empleados]
      summary: Crear empleado lavador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201': { $ref: '#/components/responses/Employee' }
  /promotions:
    get:
      tags: [Promociones]
      security: []
      summary: Listar promociones vigentes (o todas las no eliminadas para Administrador)
      description: |
        - Público, Cliente y Lavador: devuelve únicamente promociones activas (`isActive = true`), no eliminadas (`deletedAt = null`) y cuya fecha actual esté dentro de `[startsAt, endsAt]`.
        - Administrador: puede consultar todas las promociones no eliminadas (incluyendo inactivas y vencidas) enviando `includeInactive=true` con token Bearer JWT de Administrador.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: includeInactive
          required: false
          description: Solo efectivo cuando el usuario autenticado tiene rol Administrador. Incluye promociones inactivas y vencidas (excluye eliminadas lógicamente).
          schema: { type: boolean, default: false }
        - in: query
          name: all
          required: false
          description: Alias compatible para `includeInactive` (solo Administrador).
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/PromotionPage' }
    post:
      tags: [Promociones]
      security:
        - bearerAuth: []
      summary: Crear promoción (solo Administrador)
      description: |
        Rol permitido: `Administrador`.
        Sanitiza `title` y `description` contra HTML/scripts. Valida fechas ISO-8601 (`endsAt > startsAt`) y que se defina descuento fijo (`discountAmount` >= 0) o porcentual (`discountPercent` entre 0 y 100), sin combinar ambos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionInput' }
            example:
              title: Martes de Cadena Limpia
              description: Descuento especial en Lavada Detallada los martes en el lavadero
              discountPercent: 15
              startsAt: '2026-12-01T00:00:00.000Z'
              endsAt: '2026-12-31T23:59:59.000Z'
              isActive: true
      responses:
        '201': { $ref: '#/components/responses/Promotion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos (solo Administrador; código PROMOTION_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_FORBIDDEN }
                message: Solo el administrador puede gestionar promociones
        '422':
          description: Error de validación (VALIDATION_ERROR, PROMOTION_INVALID_DATES o PROMOTION_INVALID_DISCOUNT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                fechasInvalidas:
                  summary: Rango de fechas inválido
                  value:
                    data:
                      code: PROMOTION_INVALID_DATES
                      fields: { endsAt: Debe ser posterior a startsAt }
                    message: La fecha de fin debe ser posterior a la fecha de inicio
                descuentoInvalido:
                  summary: Descuento inválido
                  value:
                    data:
                      code: PROMOTION_INVALID_DISCOUNT
                      fields: { discountPercent: Debe estar entre 0 y 100 }
                    message: El porcentaje de descuento debe estar entre 0 y 100
  /promotions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Promociones]
      security:
        - bearerAuth: []
      summary: Editar promoción parcialmente (solo Administrador)
      description: |
        Rol permitido: `Administrador`.
        Permite actualizar parcialmente `title`, `description`, `discountAmount`, `discountPercent`, `startsAt` y `endsAt`.
        Aplica las mismas reglas de sanitización y validación que la creación y registra auditoría con valores anteriores y nuevos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionUpdateInput' }
            example:
              title: Lavada básica de temporada
              description: Descuento especial para clientes frecuentes
              discountPercent: 15
              startsAt: '2026-12-01T00:00:00.000Z'
              endsAt: '2026-12-31T23:59:59.000Z'
      responses:
        '200':
          description: Promoción actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Promotion' }
              example:
                data:
                  id: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  title: Lavada básica de temporada
                  description: Descuento especial para clientes frecuentes
                  discountAmount: null
                  discountPercent: 15
                  startsAt: '2026-11-30T19:00:00.000-05:00'
                  endsAt: '2026-12-31T18:59:59.000-05:00'
                  isActive: true
                  createdAt: '2026-11-19T10:00:00.000-05:00'
                  updatedAt: '2026-11-19T10:15:00.000-05:00'
                  deletedAt: null
                message: Promoción actualizada
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos (código PROMOTION_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_FORBIDDEN }
                message: Solo el administrador puede gestionar promociones
        '404':
          description: Promoción no encontrada (código PROMOTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_NOT_FOUND }
                message: Promoción no encontrada
        '422':
          description: Error de validación (VALIDATION_ERROR, PROMOTION_INVALID_DATES o PROMOTION_INVALID_DISCOUNT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Promociones]
      security:
        - bearerAuth: []
      summary: Eliminar lógicamente una promoción (solo Administrador)
      description: |
        Rol permitido: `Administrador`.
        Marca `deletedAt` y desactiva `isActive = false` conservando auditoría, citas, pagos, clientes, motos y demás registros históricos.
      responses:
        '200':
          description: Promoción eliminada lógicamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Promotion' }
              example:
                data:
                  id: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  title: Lavada básica de temporada
                  description: Descuento especial para clientes frecuentes
                  discountAmount: null
                  discountPercent: 15
                  startsAt: '2026-11-30T19:00:00.000-05:00'
                  endsAt: '2026-12-31T18:59:59.000-05:00'
                  isActive: false
                  createdAt: '2026-11-19T10:00:00.000-05:00'
                  updatedAt: '2026-11-19T10:30:00.000-05:00'
                  deletedAt: '2026-11-19T10:30:00.000-05:00'
                message: Promoción eliminada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos (código PROMOTION_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_FORBIDDEN }
                message: Solo el administrador puede gestionar promociones
        '404':
          description: Promoción no encontrada (código PROMOTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_NOT_FOUND }
                message: Promoción no encontrada
  /promotions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Promociones]
      security:
        - bearerAuth: []
      summary: Activar o desactivar promoción (solo Administrador)
      description: |
        Rol permitido: `Administrador`.
        Cambia `isActive` sin borrar la promoción ni su historial y registra auditoría (`promotion_activated` o `promotion_deactivated`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromotionStatusInput' }
            example:
              isActive: false
      responses:
        '200':
          description: Estado de promoción actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Promotion' }
              example:
                data:
                  id: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
                  title: Lavada básica de temporada
                  description: Descuento especial para clientes frecuentes
                  discountAmount: null
                  discountPercent: 15
                  startsAt: '2026-11-30T19:00:00.000-05:00'
                  endsAt: '2026-12-31T18:59:59.000-05:00'
                  isActive: false
                  createdAt: '2026-11-19T10:00:00.000-05:00'
                  updatedAt: '2026-11-19T10:20:00.000-05:00'
                  deletedAt: null
                message: Promoción desactivada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos (código PROMOTION_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_FORBIDDEN }
                message: Solo el administrador puede gestionar promociones
        '404':
          description: Promoción no encontrada (código PROMOTION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: PROMOTION_NOT_FOUND }
                message: Promoción no encontrada
        '422': { $ref: '#/components/responses/ValidationError' }
  /reviews:
    get:
      tags: [Reseñas]
      security: []
      summary: Listar reseñas públicas
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
    post:
      tags: [Reseñas]
      summary: Crear reseña de servicio completado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [washRequestId, rating, comment]
              properties:
                washRequestId: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Review' }
  /reviews/{id}/moderate:
    patch:
      tags: [Reseñas]
      summary: Ocultar o responder reseña
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isVisible: { type: boolean }
                adminReply: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Review' }
  /forum/posts:
    get:
      tags: [Foro]
      security: []
      summary: Listar publicaciones del foro
      description: |
        Devuelve publicaciones ordenadas de la más reciente a la más antigua, con sus respuestas (`replies`) ordenadas de la más antigua a la más reciente.
        - Público, Cliente y Lavador: no ven publicaciones ni respuestas eliminadas (`deletedAt != null`).
        - Administrador: puede enviar `includeDeleted=true` para incluir publicaciones y respuestas eliminadas para moderación.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - in: query
          name: includeDeleted
          required: false
          description: Solo efectivo cuando el usuario autenticado tiene rol Administrador. Incluye publicaciones y respuestas con `deletedAt` no nulo.
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ForumPage' }
    post:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Crear publicación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForumInput' }
      responses:
        '201': { $ref: '#/components/responses/ForumPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /forum/posts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Editar publicación
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/ForumPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Eliminar publicación propia o moderar como administrador
      responses:
        '204': { description: Eliminada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /forum/posts/{id}/replies:
    post:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Responder publicación
      description: |
        Roles permitidos: `Cliente`, `Lavador` y `Administrador` autenticados.
        Rechaza contenido vacío, mayor a 5000 caracteres, HTML/XSS o lenguaje ofensivo (`FORUM_REPLY_INVALID_CONTENT`). Registra auditoría en `forum_audits` y `audit_logs`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForumReplyInput' }
            example:
              content: En el lavadero usamos Motul C2 o C4 para temporada de lluvia.
      responses:
        '201': { $ref: '#/components/responses/ForumPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /forum/replies/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Editar respuesta del foro (autor o Administrador por moderación)
      description: |
        Roles permitidos:
        - `Cliente` y `Lavador`: solo pueden editar sus propias respuestas.
        - `Administrador`: puede editar cualquier respuesta por moderación.
        Valida contenido obligatorio (1 a 5000 caracteres), rechaza HTML/scripts/XSS y lenguaje ofensivo (`FORUM_REPLY_INVALID_CONTENT`), actualiza `editedAt` y registra auditoría en `forum_audits` y `audit_logs`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForumReplyInput' }
            example:
              content: Contenido corregido de la respuesta con recomendación actualizada.
      responses:
        '200':
          description: Respuesta actualizada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ForumReply' }
              example:
                data:
                  id: 7a11b22c-33d4-45e6-87f8-901234567890
                  postId: 6f29a8d2-90c8-4c5c-96f9-4b1de594d901
                  authorId: 8e4f93e6-4928-4d6f-9871-5a40e34b6d11
                  authorName: Mateo Motero
                  content: Contenido corregido de la respuesta con recomendación actualizada.
                  createdAt: '2026-11-19T10:00:00.000-05:00'
                  editedAt: '2026-11-19T10:10:00.000-05:00'
                  deletedAt: null
                message: Respuesta actualizada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos sobre esta respuesta (código FORUM_REPLY_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: FORUM_REPLY_FORBIDDEN }
                message: Solo el autor o el administrador pueden editar esta respuesta
        '404':
          description: Respuesta no encontrada (código FORUM_REPLY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: FORUM_REPLY_NOT_FOUND }
                message: Respuesta no encontrada
        '422':
          description: Contenido inválido, HTML/XSS o lenguaje ofensivo (FORUM_REPLY_INVALID_CONTENT o VALIDATION_ERROR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data:
                  code: FORUM_REPLY_INVALID_CONTENT
                  fields: { content: No se permite HTML, scripts ni etiquetas peligrosas }
                message: El contenido contiene HTML, etiquetas o scripts no permitidos
    delete:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Eliminar lógicamente una respuesta del foro (autor o Administrador)
      description: |
        Roles permitidos:
        - `Cliente` y `Lavador`: solo pueden eliminar sus propias respuestas.
        - `Administrador`: puede eliminar cualquier respuesta por moderación.
        Marca `deletedAt` sin borrar físicamente la respuesta, conserva la publicación padre y las demás respuestas, y registra auditoría en `forum_audits` y `audit_logs`.
      responses:
        '200':
          description: Respuesta eliminada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, deletedAt]
                        properties:
                          id: { type: string, format: uuid }
                          deletedAt: { type: string, format: date-time }
              example:
                data:
                  id: 7a11b22c-33d4-45e6-87f8-901234567890
                  deletedAt: '2026-11-19T10:15:00.000-05:00'
                message: Respuesta eliminada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sin permisos sobre esta respuesta (código FORUM_REPLY_FORBIDDEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: FORUM_REPLY_FORBIDDEN }
                message: Solo el autor o el administrador pueden eliminar esta respuesta
        '404':
          description: Respuesta no encontrada (código FORUM_REPLY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                data: { code: FORUM_REPLY_NOT_FOUND }
                message: Respuesta no encontrada
        '422': { $ref: '#/components/responses/ValidationError' }
  /forum/audit:
    get:
      tags: [Foro]
      security:
        - bearerAuth: []
      summary: Historial de edición, eliminación y moderación de publicaciones y respuestas (solo Administrador)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { in: query, name: actorId, schema: { type: string, format: uuid } }
        - { in: query, name: action, schema: { type: string, enum: [created, edited, deleted, moderated] } }
        - { in: query, name: targetType, schema: { type: string, enum: [forum_post, forum_reply] } }
      responses:
        '200': { $ref: '#/components/responses/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/dashboard:
    get:
      tags: [Reportes]
      summary: KPIs del dashboard administrativo
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: KPIs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardReport' }
  /reports/export:
    get:
      tags: [Reportes]
      summary: Exportar reporte
      parameters:
        - { in: query, name: format, required: true, schema: { type: string, enum: [csv, xlsx, pdf] } }
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Archivo
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
  /settings/public:
    get:
      tags: [Configuración]
      security: []
      summary: Consultar configuración pública de la aplicación
      description: Endpoint público sin autenticación. Devuelve únicamente banderas públicas seguras como loyaltyEnabled, sin exponer secretos ni configuración interna.
      responses:
        '200':
          description: Configuración pública consultada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltySettingsPublic' } }
              example:
                data:
                  loyaltyEnabled: true
                message: Configuración pública consultada exitosamente
  /settings/loyalty:
    patch:
      tags: [Configuración]
      security: [{ bearerAuth: [] }]
      summary: Activar o desactivar globalmente el módulo de Fidelización 7+1 (solo Administrador)
      description: Requiere Bearer JWT con rol Administrador (Cliente y Lavador reciben 403). Cuando loyaltyEnabled es false, todas las operaciones mutantes de Fidelización responden 409 LOYALTY_DISABLED sin eliminar historial ni premios existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltySettingsUpdate' }
            example:
              loyaltyEnabled: false
      responses:
        '200':
          description: Configuración de Fidelización actualizada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/LoyaltySettingsUpdated' } }
              example:
                data:
                  loyaltyEnabled: false
                  updatedAt: '2026-11-20T12:00:00.000-05:00'
                  updatedBy: a1b2c3d4-0000-4000-8000-000000000001
                message: Configuración de Fidelización actualizada exitosamente
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: X-Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 100 }
  responses:
    Empty:
      description: Operación exitosa
      content:
        application/json: { schema: { $ref: '#/components/schemas/Envelope' } }
    SuccessUser:
      description: Usuario creado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
    Session:
      description: Sesión
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/AuthSession' } }
    Customer:
      description: Cliente
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } }] } }
    Motorcycle:
      description: Moto
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Motorcycle' } } }] } }
    MotorcycleAssignment:
      description: Moto asociada o reasignada
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/MotorcycleAssignment' } } }] } }
    MotorcycleUnlink:
      description: Moto desvinculada
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [id, customerId]
                    properties:
                      id: { type: string, format: uuid }
                      customerId: { type: string, format: uuid, nullable: true }
    MotorcycleAssignmentPage:
      description: Página de historial de asociaciones de moto
      content: { application/json: { schema: { $ref: '#/components/schemas/MotorcycleAssignmentPage' } } }
    Service:
      description: Servicio
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Service' } } }] } }
    Appointment:
      description: Cita
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Appointment' } } }] } }
    WashRequest:
      description: Lavada
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/WashRequest' } } }] } }
    Notification:
      description: Notificación
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Notification' } } }] } }
    Loyalty:
      description: Fidelización
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LoyaltyCard' } } }] } }
    Payment:
      description: Pago manual
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } }] } }
    Expense:
      description: Gasto
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Expense' } } }] } }
    Income:
      description: Ingreso
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Income' } } }] } }
    Inventory:
      description: Insumo
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/InventoryItem' } } }] } }
    Employee:
      description: Empleado
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Employee' } } }] } }
    Promotion:
      description: Promoción
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Promotion' } } }] } }
    Review:
      description: Reseña
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Review' } } }] } }
    ForumPost:
      description: Publicación
      content:
        application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ForumPost' } } }] } }
    CustomerPage:
      description: Página de clientes
      content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } }
    MotorcyclePage:
      description: Página de motos
      content: { application/json: { schema: { $ref: '#/components/schemas/MotorcyclePage' } } }
    ServicePage:
      description: Página de servicios
      content: { application/json: { schema: { $ref: '#/components/schemas/ServicePage' } } }
    AppointmentPage:
      description: Página de citas
      content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPage' } } }
    WashRequestPage:
      description: Página de lavadas
      content: { application/json: { schema: { $ref: '#/components/schemas/WashRequestPage' } } }
    NotificationPage:
      description: Página de notificaciones
      content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } }
    LoyaltyPage:
      description: Página de tarjetas y recompensas de fidelización
      content: { application/json: { schema: { $ref: '#/components/schemas/LoyaltyPage' } } }
    LoyaltyCustomerPage:
      description: Página de clientes en fidelización
      content: { application/json: { schema: { $ref: '#/components/schemas/LoyaltyCustomerPage' } } }
    ExpensePage:
      description: Página de gastos
      content: { application/json: { schema: { $ref: '#/components/schemas/ExpensePage' } } }
    IncomePage:
      description: Página de ingresos
      content: { application/json: { schema: { $ref: '#/components/schemas/IncomePage' } } }
    InventoryPage:
      description: Página de inventario
      content: { application/json: { schema: { $ref: '#/components/schemas/InventoryPage' } } }
    EmployeePage:
      description: Página de empleados
      content: { application/json: { schema: { $ref: '#/components/schemas/EmployeePage' } } }
    PromotionPage:
      description: Página de promociones
      content: { application/json: { schema: { $ref: '#/components/schemas/PromotionPage' } } }
    ReviewPage:
      description: Página de reseñas
      content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } }
    ForumPage:
      description: Página del foro
      content: { application/json: { schema: { $ref: '#/components/schemas/ForumPage' } } }
    AuditPage:
      description: Página de auditoría
      content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } }
    Unauthorized:
      description: No autorizado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Sin permisos suficientes
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflicto de negocio
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Datos inválidos
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Envelope:
      type: object
      required: [data, message]
      properties:
        data: {}
        message: { type: string, example: Operación exitosa }
    ErrorEnvelope:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          properties:
            code: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
        message: { type: string, example: No se pudo completar la operación }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    RegisterRequest:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        username: { type: string, minLength: 3, maxLength: 40, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, format: password, minLength: 8 }
        termsAcceptedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, name, username, role, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [Cliente, Lavador, Administrador] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        termsAcceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [user, accessToken, refreshToken, expiresIn]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            notes: { type: string, nullable: true }
            motorcycles: { type: array, items: { $ref: '#/components/schemas/Motorcycle' } }
            pendingBalance: { type: integer, minimum: 0 }
            completedWashes: { type: integer, minimum: 0 }
    MotorcycleCustomerSummary:
      type: object
      required: [id, name, username]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: string }
    MotorcycleInput:
      type: object
      required: [brand, model, cc]
      properties:
        customerId: { type: string, format: uuid, nullable: true }
        brand: { type: string }
        model: { type: string }
        cc: { type: integer, minimum: 1 }
        nickname: { type: string, nullable: true }
        color: { type: string, nullable: true }
    MotorcyclePatchInput:
      type: object
      properties:
        customerId: { type: string, format: uuid, nullable: true }
        brand: { type: string }
        model: { type: string }
        cc: { type: integer, minimum: 1 }
        nickname: { type: string, nullable: true }
        color: { type: string, nullable: true }
        isActive: { type: boolean }
    Motorcycle:
      allOf:
        - $ref: '#/components/schemas/MotorcycleInput'
        - type: object
          required: [id, customerId, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            customer:
              allOf:
                - $ref: '#/components/schemas/MotorcycleCustomerSummary'
              nullable: true
            hasHistory: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AssignmentInput:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
        reason: { type: string, nullable: true, maxLength: 500 }
    MotorcycleAssignment:
      type: object
      required: [id, brand, model, cc, customerId, updatedAt]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        model: { type: string }
        cc: { type: integer, minimum: 1 }
        nickname: { type: string, nullable: true }
        color: { type: string, nullable: true }
        customerId: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    MotorcycleAssignmentAudit:
      type: object
      required: [id, motorcycleId, action, performedBy, occurredAt]
      properties:
        id: { type: string, format: uuid }
        motorcycleId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        customer:
          allOf:
            - $ref: '#/components/schemas/MotorcycleCustomerSummary'
          nullable: true
        previousCustomerId: { type: string, format: uuid, nullable: true }
        previousCustomer:
          allOf:
            - $ref: '#/components/schemas/MotorcycleCustomerSummary'
          nullable: true
        action: { type: string, enum: [assigned, unassigned, reassigned] }
        performedBy:
          type: object
          required: [id, name, username, role]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            username: { type: string }
            role: { type: string, enum: [Cliente, Lavador, Administrador] }
        occurredAt: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    ServiceInput:
      type: object
      required: [name, price, durationMinutes]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 0 }
        durationMinutes: { type: integer, minimum: 1 }
        surchargeFromCc: { type: integer, nullable: true }
        isActive: { type: boolean, default: true }
    Service:
      allOf:
        - $ref: '#/components/schemas/ServiceInput'
        - type: object
          required: [id]
          properties: { id: { type: string, format: uuid } }
    AppointmentInput:
      type: object
      required: [customerId, motorcycleId, serviceId, startAt]
      properties:
        customerId: { type: string, format: uuid }
        motorcycleId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        isLoyaltyRedemption: { type: boolean, default: false }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentInput'
        - type: object
          required: [id, status, customerName, motorcycleName, serviceName]
          properties:
            id: { type: string, format: uuid }
            customerName: { type: string }
            motorcycleName: { type: string }
            serviceName: { type: string }
            endAt: { type: string, format: date-time }
            status: { type: string, enum: [scheduled, confirmed, completed, cancelled, waitlisted] }
            cancellationReason: { type: string, nullable: true }
            cancellationFee: { type: integer, minimum: 0 }
    AvailabilitySlot:
      type: object
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        availableCapacity: { type: integer }
    WashRequestInput:
      type: object
      required: [customerId, motorcycleId, serviceId, price]
      properties:
        customerId: { type: string, format: uuid }
        motorcycleId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid, nullable: true }
        price: { type: integer, minimum: 0 }
        scheduledAt: { type: string, format: date-time, nullable: true }
        expiresInMinutes: { type: integer, minimum: 1, default: 15 }
    WashRequest:
      allOf:
        - $ref: '#/components/schemas/WashRequestInput'
        - type: object
          required: [id, status, customerName, motorcycleName, serviceName, audit]
          properties:
            id: { type: string, format: uuid }
            customerName: { type: string }
            motorcycleName: { type: string }
            serviceName: { type: string }
            status: { type: string, enum: [pending_confirmation, confirmed, rejected, expired, washing, drying, ready, paid, cancelled] }
            rejectionReason: { type: string, nullable: true }
